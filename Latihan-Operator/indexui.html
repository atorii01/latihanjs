<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Operator Modern</title>
    <!-- Font & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-surface: rgba(18, 24, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --secondary-accent: #38bdf8;
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.65);
            --radius-xl: 24px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            filter: blur(80px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .header-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
            letter-spacing: 0.3px;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #34d399;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.08);
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-ring 2s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
        }

        .title span {
            background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Input Deck Layout */
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .field-box {
            position: relative;
        }

        .field-box label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            height: 52px;
            background: var(--input-bg);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            padding: 0 16px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .input-field:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(15, 23, 42, 0.85);
        }

        /* Operator Pill Selector */
        .operator-panel {
            margin-bottom: 24px;
        }

        .operator-panel label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .operator-chips {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .chip-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .chip-btn.active {
            background: linear-gradient(135deg, var(--primary-accent) 0%, #4f46e5 100%);
            color: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 6px 16px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Native select fallback / sync container */
        .select-hidden {
            display: none;
        }

        /* Futuristic Result Display */
        .result-display {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.45) 0%, rgba(15, 23, 42, 0.75) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .result-display::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary-accent), var(--secondary-accent));
        }

        .result-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-caption {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .result-expression {
            font-size: 0.88rem;
            color: #64748b;
            font-family: 'JetBrains Mono', monospace;
            min-height: 1.2em;
        }

        .result-digit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            transition: all 0.2s ease;
        }

        .result-digit.success {
            color: #38bdf8;
            text-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
        }

        .result-digit.error {
            color: #f87171;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 20px;
            }

            .grid-inputs {
                grid-template-columns: 1fr;
            }

            .operator-chips {
                grid-template-columns: repeat(3, 1fr);
            }

            .result-display {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .result-digit {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Header Section -->
        <div class="header-meta">
            <span class="badge-tag">Episode #11</span>
            <span class="badge-live">
                <span class="pulse-dot"></span>
                Live Computation
            </span>
        </div>

        <h1 class="title">Latihan <span>Operator</span> JS</h1>

        <!-- Inputs Section -->
        <div class="grid-inputs">
            <div class="field-box">
                <label for="angka1">Operand Pertama</label>
                <input type="number" id="angka1" class="input-field" placeholder="0" step="any" autofocus>
            </div>
            <div class="field-box">
                <label for="angka2">Operand Kedua</label>
                <input type="number" id="angka2" class="input-field" placeholder="0" step="any">
            </div>
        </div>

        <!-- Operator Pills Section -->
        <div class="operator-panel">
            <label>Pilih Operasi Aritmatika</label>
            <div class="operator-chips" id="chipContainer">
                <button type="button" class="chip-btn" data-op="+">+</button>
                <button type="button" class="chip-btn" data-op="-">-</button>
                <button type="button" class="chip-btn" data-op="*">×</button>
                <button type="button" class="chip-btn" data-op="/">÷</button>
                <button type="button" class="chip-btn" data-op="%">%</button>
                <button type="button" class="chip-btn" data-op="**">xʸ</button>
            </div>

            <!-- Sinkronisasi ID select bawaan untuk script.js -->
            <select id="operator" class="select-hidden">
                <option value="" disabled selected>Pilih Operator</option>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
                <option value="**">**</option>
            </select>
        </div>

        <!-- Result Box -->
        <div class="result-display" id="resultBox">
            <div class="result-text-group">
                <span class="result-caption">Hasil Evaluasi</span>
                <span class="result-expression" id="formulaPreview">Menunggu input...</span>
            </div>
            <div class="result-digit" id="hasil">0</div>
        </div>
    </div>

    <!-- Integrasi interaktivitas tombol chip ke select & formula preview -->
    <script>
        const chips = document.querySelectorAll('.chip-btn');
        const operatorSelect = document.getElementById('operator');
        const a1 = document.getElementById('angka1');
        const a2 = document.getElementById('angka2');
        const preview = document.getElementById('formulaPreview');

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                
                // Sinkronkan nilai ke <select id="operator"> agar script.js tetap kompatibel
                operatorSelect.value = chip.dataset.op;
                operatorSelect.dispatchEvent(new Event('change'));
                updateFormula();
            });
        });

        function updateFormula() {
            const v1 = a1.value || '?';
            const v2 = a2.value || '?';
            const op = operatorSelect.value || '...';
            preview.textContent = `${v1} ${op} ${v2}`;
        }

        a1.addEventListener('input', updateFormula);
        a2.addEventListener('input', updateFormula);
    </script>
    <script src="script.js"></script>
</body>
</html>
